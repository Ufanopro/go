{{template "header"}}

<main class="container mt-4">
    <!-- Mensajes de flash -->
    {{ if .FlashMessages }}
    <div class="alert alert-danger">
        {{ range .FlashMessages }}
            <p>{{ . }}</p>
        {{ end }}
    </div>
    {{ end }}
    <h1>Formularios</h1>
    <div class="alert alert-success alert-dismissible fade show d-none" id="mensajeAlerta">
        Mensaje de éxito
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div class="row">
        <form action="/formularios-post" method="POST" novalidate>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Nombre" required />
            </div>
            
            <div class="mb-3">
                <label for="correo" class="form-label">E-Mail:</label>
                <input type="email" name="correo" id="correo" class="form-control" placeholder="E-Mail" required />
            </div>
            
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" name="telefono" id="telefono" class="form-control" placeholder="Teléfono" pattern="[0-9]{9,15}" required />
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" minlength="8" required />
            </div>
            
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirmar Contraseña:</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirmar Contraseña" minlength="8" required />
            </div>    
            <hr />
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>
</main>

{{template "footer"}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
