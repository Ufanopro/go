{{template "header"}}

<main class="container mt-4">
    <h1>Upload</h1>
    <div class="alert alert-success alert-dismissible fade show d-none" id="mensajeAlerta">
        Mensaje de éxito
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div class="row">
        <form action="/formulario/upload-post" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="foto" class="form-label">Foto :</label>
                <input type="file" name="foto" id="foto" class="form-control" placeholder="Nombre" required />
            </div>  
            <hr />
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>
</main>

{{template "footer"}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
