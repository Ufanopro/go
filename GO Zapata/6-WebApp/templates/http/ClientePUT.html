{{template "header"}}

<main class="container mt-4">
    <h1>Actualizar Cliente</h1>
    <div class="alert alert-success alert-dismissible fade show d-none" id="mensajeAlerta">
        Cliente actualizado satisfactoriamente!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div class="row">
        <form action="/http/update" method="POST">
            <input type="hidden" name="_method" value="PUT"> <!-- Simulación de PUT -->
            
            <div class="mb-3">
                <label for="id" class="form-label">Id:</label>
                <input type="text" name="id" id="id" class="form-control" placeholder="Id" required />
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Nombre" required />
            </div>
            
            <div class="mb-3">
                <label for="correo" class="form-label">E-Mail:</label>
                <input type="email" name="correo" id="correo" class="form-control" placeholder="E-Mail" required />
            </div>
            
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono:</label>
                <input type="tel" name="telefono" id="telefono" class="form-control" placeholder="Teléfono" pattern="[0-9]{9,15}" required />
            </div>
            
            <hr />
            <button type="submit" class="btn btn-primary">Actualizar Cliente</button>
        </form>
    </div>
</main>

{{template "footer"}}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
