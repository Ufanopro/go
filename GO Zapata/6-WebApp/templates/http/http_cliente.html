{{template "header"}}

<main class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a href="/recursos">Utilidades</a></li>
            <li class="breadcrumb-item active" aria-current="page">Clientes</li>
        </ol>
    </nav>

    <h1>Cliente HTTP</h1>

    {{if .Mensaje}}
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{.Mensaje}}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {{end}}

    <p class="d-flex justify-content-end gap-2">
        <a href="/http/crear" class="btn btn-success"><i class="fas fa-check"></i> Crear</a>
        <a href="/http/update" class="btn btn-primary"><i class="fas fa-sync-alt"></i> Actualizar</a>
    </p>

    <div class="table-responsive">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                </tr>
            </thead>
            <tbody>
                {{range .Datos}}
                <tr>
                    <td>{{.Id}}</td>
                    <td>{{.Nombre}}</td>
                    <td>{{.Correo}}</td>
                    <td>{{.Telefono}}</td>
                    <td>
                        <a href="/cliente-http/editar/{{.Id}}"><i class="fas fa-edit"></i></a>
                        <a href="javascript:void(0);" onclick="confirmarSweet('Realmente desea eliminar el registro?','/cliente-http/eliminar/{{.Id}}');"><i class="fas fa-trash-alt"></i></a>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</main>

{{template "footer"}}
