{{template "header"}}

<main class="container mt-4">
    <h1>Eliminar Cliente</h1>
    <p>¿Estás seguro de que deseas eliminar a <strong>{{.Nombre}}</strong>?</p>
    <p>Correo: {{.Correo}} | Teléfono: {{.Telefono}}</p>

    <form action="/mysql/delete/{{.Id}}" method="POST">
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="/mysql" class="btn btn-secondary">Cancelar</a>
    </form>
</main>

{{template "footer"}}
