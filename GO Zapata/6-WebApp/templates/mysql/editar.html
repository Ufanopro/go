{{template "header"}}

<main class="container mt-4">
    <h1>Editar Cliente</h1>
    <form action="/mysql/editar/{{ .Id }}" method="POST" novalidate>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ .Nombre }}" required />
        </div>

        <div class="mb-3">
            <label for="correo" class="form-label">E-Mail:</label>
            <input type="email" name="correo" id="correo" class="form-control" value="{{ .Correo }}" required />
        </div>

        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="tel" name="telefono" id="telefono" class="form-control" value="{{ .Telefono }}" pattern="[0-9]{9,15}" required />
        </div>

        <hr />
        <button type="submit" class="btn btn-primary">Actualizar</button>
    </form>
</main>

{{template "footer"}}
