{{template "header"}}

<main class="container"></main>
<body>
    <h1>Parámetros</h1>
    <p>Captura de parámetros por URL</p>

    <ul>
        {{ range $key, $value := . }}
        <li>{{ $key }}: {{ $value }}</li>
        {{ else }}
        <li>No se recibieron parámetros.</li>
        {{ end }}
    </ul>

     <!-- Mostrar el valor de p2 en un párrafo -->
     <p>Valor de p2: {{ index . "param2" }}</p>

    <a href="/">Volver a la página principal</a>
    </main>
    {{template "footer"}}
    <script src="/public/js/script.js"></script>
</body>
</html>
