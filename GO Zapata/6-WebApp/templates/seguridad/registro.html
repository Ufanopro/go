{{template "header"}}

<main class="container">
    <h1>Registro</h1>

    {{if .Errores}}
    <div class="alert alert-danger">
        <ul>
            {{range .Errores}}
            <li>{{.}}</li>
            {{end}}
        </ul>
    </div>
    {{end}}

    <div class="row">
        <form action="/seguridad/registro_post" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre </label>
                <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Nombre" value="{{.Nombre}}" />
            </div>
            <div class="form-group">
                <label for="correo">E-Mail</label>
                <input type="text" name="correo" id="correo" class="form-control" placeholder="E-Mail" value="{{.Correo}}" />
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" name="telefono" id="telefono" class="form-control" placeholder="Teléfono" value="{{.Telefono}}" />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" />
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirmar Contraseña" />
            </div>
            <hr />
            <input type="submit" class="btn btn-primary" value="Enviar" />
        </form>
    </div>
</main>

{{template "footer"}}
